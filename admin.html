<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MetDash · 관리</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="admin">
    <main class="admin-wrap">
      <header class="admin-head">
        <h1>MetDash 관리</h1>
        <button id="admin-signout" type="button" class="admin-ghost hidden">잠그기</button>
      </header>

      <section id="admin-gate" class="admin-card">
        <p class="admin-note">
          Convex 대시보드에 설정한 <strong>ADMIN_KEY</strong>를 입력하세요.<br />
          키는 이 브라우저 탭에만 보관되고, 탭을 닫으면 지워집니다.
        </p>
        <form id="admin-form" autocomplete="off">
          <input id="admin-key" type="password" placeholder="관리자 키" autocomplete="off" />
          <button type="submit">열기</button>
        </form>
        <p id="admin-error" class="admin-error hidden"></p>
      </section>

      <section id="admin-panel" class="hidden">
        <div id="admin-toast" class="admin-toast hidden"></div>

        <nav class="admin-tabs" aria-label="관리 메뉴">
          <button type="button" data-tab="runs" class="on">최근 플레이</button>
          <button type="button" data-tab="seen">최근 접속</button>
          <button type="button" data-tab="schools">학교</button>
          <button type="button" data-tab="players">플레이어</button>
        </nav>

        <div data-pane="runs">
          <p class="admin-note small">최근에 한 순서대로, 그 학생의 최근 판 중 <strong>최고 점수</strong>입니다. 누르면 판별 기록이 펼쳐집니다.</p>
          <div id="admin-runs" class="admin-list"></div>
        </div>

        <div data-pane="seen" class="hidden">
          <p class="admin-note small">로그인한 기기가 마지막으로 저장한 때입니다. 관리 작업도 시간을 바꿉니다.</p>
          <div id="admin-seen" class="admin-list"></div>
        </div>

        <div data-pane="schools" class="hidden">
          <div class="admin-head-row">
            <p class="admin-note small">같은 학교가 두 줄이면 <strong>합치기</strong> → 남길 학교의 <strong>여기로</strong>를 누르세요.</p>
            <button id="admin-recompute" type="button" class="admin-ghost">합계 재계산</button>
          </div>
          <div id="admin-schools" class="admin-list"></div>
        </div>

        <div data-pane="players" class="hidden">
          <input id="admin-search" type="search" placeholder="닉네임 · 학교 검색" autocomplete="off" />
          <p class="admin-note small">이름을 누르면 관리 버튼이 열립니다.</p>
          <div id="admin-players" class="admin-list"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
